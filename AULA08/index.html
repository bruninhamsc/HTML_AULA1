<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AULA 08</title>
</head>
<body>
    <!-- 
    <Form>      = Define um formulário
    <input>     = Campo de entrada (com vários tipos: text, password, email, number e etc)
    <label>     = Associa um texto descritivo a um <input>
    <textarea>  = Área de texto maior.
    <select> e <option>      = Criam menus suspensos (dropdowns)
    <botton>    = Botão clicável
    <fieldset> e <legend>    = Agrupam e nomeiam partes de um formulário 
    <datalist>  = Lista de sujestões para <input>
    -->

    <h1>formulário Completo</h1>

    <form action="/enviar-dados" method="post">
        <fieldset>
            <legend>Informações Pessoais</legend>
            
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="seuemail@gmail.com.br" required><br>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" min="18" max="99">

            <label for="data-nascimento">Data de Nascimento</label>
            <input type="date" id="data-nascimento" name="data-nascimento">

            <label for="genero">Gênero</label>
            <select name="genero" id="genero">
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="Outro">Outro</option>
                <option value="Prefiro_nao_dizer">Prefiro nao dizer</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Detalhes Adicionais</legend>
            <label for="bio">Sobre você:</label>
            <textarea id="bio" name="bio" rows="3" placeholder="Fale um pouco sobre você...">
            </textarea>
             
            <label for="linguagem">Linguagem Favorita:</label>
            <input type="text" name="linguagem" id="linguagem" list="linguagens">
            <datalist>
                <option value="HTML"></option>
                <option value="CSS"></option>
                <option value="JavaScript"></option>
                <option value="Python"></option>
                <option value="Java"></option>
            </datalist>
            
        </fieldset>
        
    </form>
</body>
</html>
