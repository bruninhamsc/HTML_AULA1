<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AULA 06</title>
</head>
<body>
    <!-- A semântica no HTML significa usar tags certas para cada tipo de conteúdo, ajudando navegadores, mecânismos e busca e leitores de tela entendereem melhor a estrutura da pagina.-->

    <!--------------------------------------------------------->
     
    <!-- Beneficios do html semantico-->
      <!-- Melhor a acessibilidade (leitores de tela conseguem interpretar melhor)
       Melhor o SEO (O Google entende melhor a estrutura do site)
       Facilita a manutenção do código (código mais organizado e legível)
       Ajuda na responsabilidade (tags semânticas trabalham melhor com CSS e JS)-->

    <!--------------------------------------------------------->

       <!-- SEM SEMÂNTICA -->
       <!--<a href="#">Inicio</a>
       <a href="">Sobre</a>
       <p>Texto principal do site.</p>
       <p>Todos os direitos reservados.</p> -->

    <!--------------------------------------------------------->

        <!-- HTML SEMÂNTICO -->
        <header>
            <!-- O topo do site ou de uma seção (logo, Título e Menu de navegação) -->
            <nav>
                <!-- Contém links de navegação para outras partes do site. -->
                <a href="">Inicio</a>
                <a href="">Sobre</a>
            </nav>
        </header>
        <main>
            <!-- Contém o conteúdo principal da página -->
            <h1>Texto principal do site.</h1>
        </main>
        <footer>
            <!-- Usada para agrupar conteúdos relacionados dentro de uma página, geralmente com um título, indicando que fazem parte de um tema específico. -->
            <p>Todos os direitos reservados.</p>
        </footer>

    
</body>
</html>
