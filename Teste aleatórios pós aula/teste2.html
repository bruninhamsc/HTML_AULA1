<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coração 3D - I Love You</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: monospace;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>

  <canvas id="heartCanvas"></canvas>

  <script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const text = "i love you";
    const points = [];
    const numPoints = 350; // Quantidade de textos formando o coração

    // Equação paramétrica do coração 3D (Torus de Coração)
    for (let i = 0; i < numPoints; i++) {
      const u = (i / numPoints) * Math.PI * 2;
      for (let j = 0; j < 5; j++) {
        const v = (j / 5) * Math.PI * 2;
        
        // Equação base do coração 2D
        let x = 16 * Math.pow(Math.sin(u), 3);
        let y = -(13 * Math.cos(u) - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u));
        let z = (Math.sin(v) * 3);

        // Aplica uma pequena espessura/curvatura 3D
        x += Math.cos(v) * 0.8;
        y += Math.sin(v) * 0.8;

        points.push({ x, y, z, text });
      }
    }

    let angleX = 0;
    let angleY = 0;

    function render() {
      // Efeito de iluminação / rastro
      ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
      ctx.fillRect(0, 0, width, height);

      angleY += 0.015; // Velocidade de rotação horizontal
      angleX += 0.005; // Velocidade de rotação vertical

      // Ordena os pontos pelo Z para renderizar o que está atrás primeiro (depth buffer simples)
      const projectedPoints = points.map(p => {
        // Rotação Y
        let x1 = p.x * Math.cos(angleY) + p.z * Math.sin(angleY);
        let z1 = -p.x * Math.sin(angleY) + p.z * Math.cos(angleY);

        // Rotação X
        let y2 = p.y * Math.cos(angleX) - z1 * Math.sin(angleX);
        let z2 = p.y * Math.sin(angleX) + z1 * Math.cos(angleX);

        // Projeção perspectiva
        const scale = 350 / (350 + z2);
        const projectedX = x1 * scale * 12 + width / 2;
        const projectedY = y2 * scale * 12 + height / 2;

        return {
          x: projectedX,
          y: projectedY,
          z: z2,
          scale: scale,
          text: p.text
        };
      });

      projectedPoints.sort((a, b) => b.z - a.z);

      // Desenha cada texto
      projectedPoints.forEach(p => {
        const fontSize = Math.max(8, 13 * p.scale);
        ctx.font = `${fontSize}px monospace`;
        
        // Cor rosa neon/brilhante similar ao vídeo
        const alpha = Math.min(1, Math.max(0.2, (p.z + 20) / 40));
        ctx.fillStyle = `rgba(255, 150, 170, ${alpha})`;
        
        ctx.fillText(p.text, p.x, p.y);
      });

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
