<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Meu Pai</title>
  
  <!-- Importando a fonte caligráfica "Great Vibes" -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0b0b0b;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // Ajusta o tamanho da tela
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // Aguarda a fonte carregar antes de desenhar
    document.fonts.ready.then(() => {
      animate();
    });

    // Classe auxiliar para vetores
    class Vector {
      constructor(x, y) {
        this.x = x;
        this.y = y;
      }
      add(v) {
        return new Vector(this.x + v.x, this.y + v.y);
      }
    }

    // Origem no centro da tela
    let origin = new Vector(canvas.width / 2, canvas.height / 2);
    
    window.addEventListener("resize", () => {
      origin = new Vector(canvas.width / 2, canvas.height / 2);
    });

    // Função matemática do coração
    let polar = (rad, time) => {
      rad += Math.sin(time / 100);
      let x = 16 * Math.sin(rad) ** 3;
      let y =
        13 * Math.cos(rad) -
        5 * Math.cos(2 * rad) -
        2 * Math.cos(3 * rad) -
        Math.cos(4 * rad);
      
      // Escala da animação (fator de pulsação)
      let scale = (Math.sin(time / 10) + 3) * 4;

      return {
        pos: new Vector(x * scale, -y * scale).add(origin),
        scale: scale // Retornamos a escala para usar no tamanho da fonte
      };
    };

    let time = 0;

    function animate() {
      // Limpa a tela com transparência para dar o efeito de rastro
      ctx.fillStyle = "rgba(11, 11, 11, 0.2)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // --- 1. DESENHA O CORAÇÃO ---
      ctx.beginPath();
      ctx.strokeStyle = "#ff0055";
      ctx.lineWidth = 2;
      ctx.shadowBlur = 15;
      ctx.shadowColor = "#ff0055";

      const step = (Math.PI * 2) / 100;
      let currentScale = 1;

      for (let rad = 0; rad <= Math.PI * 2; rad += step) {
        let p = polar(rad, time);
        currentScale = p.scale; // Guarda a escala atual da pulsação
        if (rad === 0) {
          ctx.moveTo(p.pos.x, p.pos.y);
        } else {
          ctx.lineTo(p.pos.x, p.pos.y);
        }
      }
      ctx.closePath();
      ctx.stroke();

      // --- 2. DESENHA O TEXTO DENTRO DO CORAÇÃO ---
      // O tamanho da fonte acompanha dinamicamente a pulsação (currentScale)
      let fontSize = Math.floor(currentScale * 3.5); 
      
      ctx.font = `${fontSize}px 'Great Vibes', cursive`;
      ctx.fillStyle = "#ffffff"; // Cor branca com brilho rosa
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      
      // Brilho do texto em neon
      ctx.shadowBlur = 12;
      ctx.shadowColor = "#ff0055";

      // O deslocamento -currentScale * 1.5 centraliza visualmente o texto dentro da forma do coração
      ctx.fillText("Eu te amo Pai", origin.x, origin.y - (currentScale * 1.5));

      time += 0.5; // Avança o tempo da animação
      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
